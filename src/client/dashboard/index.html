<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aurameter</title>
    <style>
      /* reset — devvit iframe has no stylesheet */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }

      /* reddit-aligned color tokens */
      :root {
        --bg:         #dae0e6;
        --surface:    #ffffff;
        --surface-2:  #f6f7f8;
        --border:     #edeff1;
        --fg:         #1c1c1c;
        --fg-muted:   #878a8c;
        --accent:     #ff4500;   /* reddit orange */
        --accent-dim: #ff6534;
        --tea:        #c47c2b;
        --time:       #3b82f6;
        --clown:      #ef4444;
        --slop:       #8b5cf6;
        --success:    #46d160;
        --warn:       #ffd635;
        --radius:     4px;
        --radius-lg:  8px;
        --shadow:     0 1px 3px rgba(0,0,0,.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:        #1a1a1b;
          --surface:   #272729;
          --surface-2: #1e1e1f;
          --border:    #343536;
          --fg:        #d7dadc;
          --fg-muted:  #818384;
        }
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
